server {
    listen 80;
    server_name _;

    # Docker internal DNS — re-resolves upstream IPs after container restarts
    # without requiring an nginx restart.
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $gunicorn http://web:8000;
        proxy_pass $gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some scoring/matching endpoints (e.g. arbitrary-club replacement
        # search) are intentionally uncached and can take several minutes —
        # matches gunicorn's --timeout in docker-compose.prod.yml. Also
        # covers a cold worker's post_worker_init cache warm-up
        # (config/gunicorn.conf.py) racing an early request.
        proxy_read_timeout 600s;
    }
}
